name: 功能建议 / Feature request
description: 提议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便？什么场景下会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的变通办法
