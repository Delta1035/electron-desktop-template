name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build the installers as artifacts without creating a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Refuses template defaults and an update feed that is not this repository.
      - name: Verify product identity
        shell: bash
        run: node scripts/check-identity.mjs --release --repository "$GITHUB_REPOSITORY"
      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi
      - name: Verify CHANGELOG has a section for the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/changelog.mjs notes "$GITHUB_REF_NAME" > /dev/null
      - run: pnpm install --frozen-lockfile
      # A tag can point at a commit CI never saw, so run the full checks again.
      - run: pnpm check
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: pnpm e2e
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e
      # Release builds deliberately skip the Electron download cache to avoid cache poisoning.
      - run: pnpm --filter @desktop/desktop build:${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/verify-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          # latest*.yml and the blockmaps are what installed apps read to update themselves.
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Only the product name and release notes are needed here; `pnpm release` wrote the notes
      # into CHANGELOG.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            app.config.json
            CHANGELOG.md
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Write release notes
        run: node scripts/changelog.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Write checksums
        working-directory: installers
        run: sha256sum -- * > SHA256SUMS.txt
      # Verify with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            installers/*.exe
            installers/*.AppImage
            installers/*.deb
      # Created as a draft: check the installers, then publish it on GitHub. Installed apps only
      # see published releases, so publishing is what rolls the update out.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          product=$(node -p "require('./app.config.json').productName")
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$product $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
